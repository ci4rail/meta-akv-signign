# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "akv-signing"
BBFILE_PATTERN_akv-signing = "^${LAYERDIR}/"
BBFILE_PRIORITY_akv-signing = "100"

LAYERSERIES_COMPAT_akv-signing = "scarthgap"
LAYERDEPENDS_akv-signing = "core openembedded-layer meta-toradex-security"

# Enable this in configuration to route both Toradex HAB/imx-boot signing and
# FIT signing through Azure Key Vault via PKCS#11.
AKV_SIGNING_ENABLE ?= "0"

# Toradex secure-boot HSM integration is intentionally used for both imx-boot
# and FIT signing. The Azure provider does not require a real PIN, but the
# Toradex helper requires a non-empty value before invoking mkimage/CST.
TDX_SIGNED_HSM ?= "${AKV_SIGNING_ENABLE}"
TDX_SIGNED_HSM_TOKEN_PIN ?= "${@bb.utils.contains('AKV_SIGNING_ENABLE', '1', 'unused', '', d)}"
TDX_SIGNED_HSM_PKCS11_MODULE_PROVIDER ?= "${@bb.utils.contains('AKV_SIGNING_ENABLE', '1', 'azure-keyvault-pkcs11-native', '', d)}"
TDX_SIGNED_HSM_PKCS11_MODULE_PATH ?= "${@bb.utils.contains('AKV_SIGNING_ENABLE', '1', '${libdir}/pkcs11/azure-keyvault-pkcs11.so', '', d)}"

# Allow Azure OIDC/workload-identity configuration to enter BitBake's datastore.
# CI should provide AZURE_APP_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and
# AZURE_FEDERATED_TOKEN_FILE. AZURE_APP_ID is mapped to AZURE_CLIENT_ID by the
# akv-signing class because Azure Identity expects AZURE_CLIENT_ID.
BB_ENV_PASSTHROUGH_ADDITIONS:append = " AZURE_APP_ID AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_FEDERATED_TOKEN_FILE AZURE_AUTHORITY_HOST"
